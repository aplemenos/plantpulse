[tool.pyright]
include = ["app", "agent", "ml", "tests"]
stubPath = "typings"
pythonVersion = "3.11"
typeCheckingMode = "strict"

# Strict everywhere for the code we write: every parameter, return value and
# generic must be annotated, no implicit Optionals, no private access, no
# unused imports. The four rules below are switched off because they fire on
# types leaking out of third-party stubs (pandas-stubs itself declares
# `**kwargs: Unknown` and `list[Unknown]` parameters on methods such as
# fillna, shift, groupby and to_numpy), not on anything this code controls.
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["typings"]
