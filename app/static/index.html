<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlantPulse</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #5b6472; --line: #e3e6eb;
    --accent: #1f6feb; --ok: #1a7f37; --warn: #b35900; --bad: #c62828; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #98a2b3; --line: #2a3039;
            --accent: #5b9dff; --ok: #4cc26b; --warn: #f0a24a; --bad: #ff6b6b; --chip: #222831; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 20px 0; }
  .site { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
          cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .site.active { outline: 2px solid var(--accent); outline-offset: -1px; }
  .site .id { font-weight: 600; }
  .site .kw { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 14px; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 280px; min-width: 0; padding: 10px 12px; border-radius: 8px;
                     border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button.go { padding: 10px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .examples button { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px;
                     padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .answer { margin-top: 14px; white-space: pre-wrap; }
  .mode { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .mode input[type=text] { flex: 0 1 220px; padding: 6px 10px; font-size: 13px; }
  .verdict { margin-top: 8px; font-size: 13px; font-weight: 600; }
  .verdict.ok { color: var(--accent); } .verdict.bad { color: var(--bad); }
  details { margin-top: 10px; color: var(--muted); font-size: 13px; }
  pre { overflow-x: auto; background: var(--bg); border-radius: 8px; padding: 10px; font-size: 12px; }
  svg { width: 100%; height: 160px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
  .stats { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>PlantPulse</h1>
      <p class="sub">Agentic analytics over renewable-energy plant telemetry: anomaly detection, forecasting, and incident search.</p>
    </div>
    <a href="/docs">API docs &rarr;</a>
  </header>

  <div class="grid" id="sites"></div>

  <div class="panel">
    <h2>Ask the agent</h2>
    <form id="ask">
      <input type="text" id="q" placeholder="e.g. is anything wrong with wind-02, and have we seen it before?" autocomplete="off">
      <button class="go" type="submit">Ask</button>
    </form>
    <div class="mode">
      <label><input type="checkbox" id="investigate"> Investigate (plan → execute → verify)</label>
      <input type="text" id="asOf" placeholder="as of, e.g. 2026-04-18 11:00" autocomplete="off" hidden>
    </div>
    <div class="examples" id="examples"></div>
    <div class="answer" id="answer"></div>
    <div class="verdict" id="verdict" hidden></div>
    <details id="trace" hidden><summary>Tool calls</summary><pre id="traceBody"></pre></details>
  </div>

  <div class="panel">
    <h2 id="streamTitle">Live stream</h2>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>actual kW</span>
      <span><i style="background:var(--muted)"></i>expected kW</span>
      <span><i style="background:var(--bad)"></i>flagged anomaly</span>
    </div>
    <svg id="chart" viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
    <div class="stats" id="streamStats"></div>
  </div>
</div>

<script>
const EXAMPLES = [
  "is anything wrong with wind-02?",
  "forecast solar-01 for the next hour",
  "have we seen this vibration before on wind-03?",
  "solar-02 output drop - any similar past incident?",
];

const $ = (id) => document.getElementById(id);
let source = null, points = [];

async function loadSites() {
  const sites = await (await fetch("/sites")).json();
  const grid = $("sites");
  grid.innerHTML = "";
  for (const s of sites) {
    const el = document.createElement("button");
    el.className = "site"; el.dataset.site = s.site_id;
    el.innerHTML = `<div class="id"><span class="dot"></span>${s.site_id}</div>
                    <div class="kw">${s.site_type} · ${s.capacity_kw.toLocaleString()} kW</div>
                    <div class="kw status">checking…</div>`;
    el.onclick = () => startStream(s.site_id);
    grid.appendChild(el);
    fetch("/predict/anomaly", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({site_id: s.site_id})})
      .then(r => r.json()).then(p => {
        const dot = el.querySelector(".dot"), st = el.querySelector(".status");
        if (p.is_curtailed) { dot.classList.add("warn"); st.textContent = "curtailed"; }
        else if (p.is_anomaly) { dot.classList.add("bad"); st.textContent = `anomaly · p=${p.anomaly_probability}`; }
        else { dot.classList.add("ok"); st.textContent = `healthy · ${p.actual_power_kw} kW`; }
      });
  }
  startStream(sites[0].site_id);
}

async function startStream(siteId) {
  if (source) source.close();
  points = [];
  document.querySelectorAll(".site").forEach(e => e.classList.toggle("active", e.dataset.site === siteId));
  const top = await (await fetch(`/sites/${siteId}/top-flagged`)).json();
  const start = new Date(new Date(top.timestamp.replace(" ", "T") + "Z").getTime() - 12 * 3600e3)
    .toISOString().slice(0, 19);
  $("streamTitle").textContent =
    `Live replay · ${siteId} · around its strongest flagged moment (${top.timestamp}), model scored per event`;
  source = new EventSource(`/stream/telemetry/${siteId}?speed=9000&tail=96&start=${start}`);
  source.addEventListener("telemetry", (e) => {
    points.push(JSON.parse(e.data));
    if (points.length > 96) points.shift();
    draw();
  });
}

function draw() {
  const W = 600, H = 160, pad = 6;
  const max = Math.max(1, ...points.map(p => Math.max(p.power_kw, p.expected_power_kw)));
  const x = (i) => pad + (i / 95) * (W - 2 * pad);
  const y = (v) => H - pad - (v / max) * (H - 2 * pad);
  const line = (key) => points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
  const flags = points.map((p, i) => p.is_anomaly
    ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.power_kw).toFixed(1)}" r="3.5" fill="var(--bad)"/>` : "").join("");
  $("chart").innerHTML =
    `<path d="${line("expected_power_kw")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
     <path d="${line("power_kw")}" fill="none" stroke="var(--accent)" stroke-width="2"/>${flags}`;
  const last = points[points.length - 1];
  $("streamStats").textContent =
    `${last.timestamp} · ${last.power_kw} kW actual vs ${last.expected_power_kw} kW expected · anomaly p=${last.anomaly_probability}`;
}

$("ask").onsubmit = async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("answer").textContent = "Thinking…"; $("trace").hidden = true; $("verdict").hidden = true;
  if ($("investigate").checked) return runInvestigation(question);
  const res = await (await fetch("/agent/query", {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({question})})).json();
  $("answer").textContent = res.answer;
  $("traceBody").textContent = JSON.stringify(res.tool_calls, null, 2);
  $("trace").hidden = false;
  const traceRef = res.trace_id ? ` · MLflow trace ${res.trace_id}` : "";
  if (res.unsupported_citations?.length)
    $("answer").textContent += `\n\n(Cites logs that were never retrieved: ${res.unsupported_citations.join(", ")})`;
  $("trace").querySelector("summary").textContent =
    `Tool calls (${res.tool_calls.length}, mode: ${res.mode}${res.llm_error ? ", LLM failed - fell back" : ""})${traceRef}`;
};

async function runInvestigation(question) {
  const as_of = $("asOf").value.trim() || null;
  const res = await (await fetch("/agent/investigate", {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({question, as_of})})).json();
  const v = res.verification;
  $("answer").textContent = res.answer;
  $("verdict").hidden = false;
  $("verdict").className = "verdict " + (v.passed ? "ok" : "bad");
  $("verdict").textContent = v.passed
    ? `Verified independently${v.revisions ? ` after ${v.revisions} revision` : ""} (${Object.keys(v.checks).join(", ")})`
    : `Not verified: ${v.issues.map(i => i.detail).join("; ")}`;
  $("traceBody").textContent = JSON.stringify({plan: res.plan, steps: res.steps, verification: v}, null, 2);
  $("trace").hidden = false;
  const ran = res.steps.filter(s => !s.skipped).length;
  $("trace").querySelector("summary").textContent =
    `Plan: ${res.plan.length} steps, ${ran} run, ${res.plan.length - ran} skipped · mode: ${res.mode}` +
    `${res.llm_error ? ", LLM failed - fell back" : ""}${res.trace_id ? ` · MLflow trace ${res.trace_id}` : ""}`;
}

$("investigate").onchange = () => { $("asOf").hidden = !$("investigate").checked; };

// Demo: investigate a site at its most suspicious moment, so the conditional log search runs.
const demo = document.createElement("button");
demo.type = "button"; demo.textContent = "investigate wind-03 at its most suspicious moment";
demo.onclick = async () => {
  const top = await (await fetch("/sites/wind-03/top-flagged")).json();
  $("investigate").checked = true; $("asOf").hidden = false; $("asOf").value = top.timestamp;
  $("q").value = "investigate wind-03"; $("ask").requestSubmit();
};
$("examples").appendChild(demo);

for (const ex of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = ex;
  b.onclick = () => { $("q").value = ex; $("ask").requestSubmit(); };
  $("examples").appendChild(b);
}

loadSites();
</script>
</body>
</html>
