services:
  api:
    build: .
    ports:
      - "8000:7860"
    environment:
      REDIS_URL: redis://redis:6379/0
      # ANTHROPIC_API_KEY: set in your shell or a .env file to enable LLM tool-use mode
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
