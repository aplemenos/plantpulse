name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Rebuild data, models and vector index from source (seeded, reproducible)
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: make pipeline

      - name: Type check (pyright strict) and lint (ruff)
        run: make lint

      - name: Unit, contract and agent tests
        run: make test

      - name: Regression gate (quality + routing strict; latency loosened for CI hardware)
        run: python -m ml.regression_check --latency-tolerance 2.0

      - name: Upload regression record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-history
          path: ml/regression_history.jsonl

  docker-build:
    needs: test-and-regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs the full training pipeline inside the build)
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t plantpulse:${{ github.sha }} .
      - name: Smoke-test the container
        run: |
          docker run -d --name pp -p 7860:7860 plantpulse:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf -X POST localhost:7860/agent/query -H 'Content-Type: application/json' \
            -d '{"question":"is anything wrong with wind-02?"}'
          docker rm -f pp

  deploy-hf-space:
    # Continuous deployment: only on main, only once the gates above pass,
    # and only if you've configured the HF_TOKEN secret + HF_SPACE variable.
    needs: docker-build
    if: github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}   # e.g. "your-username/plantpulse"
        run: |
          mkdir /tmp/space
          git archive HEAD | tar -x -C /tmp/space
          cd /tmp/space
          { cat infra/hf_space_header.md; cat README.md; } > README.tmp && mv README.tmp README.md
          git init -q -b main
          git config user.email "ci@github-actions"
          git config user.name "github-actions"
          git add -A && git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
